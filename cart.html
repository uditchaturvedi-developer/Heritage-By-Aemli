<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Account — Heritage By Aemli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="account">
<a class="skip" href="#main">Skip to content</a>
<div id="siteHeader"></div>

<main id="main">
  <div class="auth-wrap">
    <div class="auth-card account-card">
      <h1>My Account</h1>
      <div class="prof">
        <div class="avatar" id="avatar">A</div>
        <div><div id="accName" style="font-family:var(--serif);font-size:22px;font-weight:600"></div><div id="accEmail" style="color:var(--muted);font-size:14px"></div></div>
      </div>
      <div class="ord">You have <b id="ordCount">0</b> item(s) in your bag and <b id="wishCount2">0</b> saved style(s).</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px">
        <a class="btn btn-outline" href="cart.html">View Cart</a>
        <a class="btn btn-outline" href="wishlist.html">Wishlist</a>
        <button class="btn btn-primary" onclick="window.Store.logout();AEMLI_UI.toast('Signed out');location.href='index.html'">Sign Out</button>
      </div>
    </div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
  const S=window.Store; const u=S.currentUser();
  if(!u){ window.location.href='login.html'; }
  else{
    document.getElementById('avatar').textContent=u.name.charAt(0).toUpperCase();
    document.getElementById('accName').textContent=u.name;
    document.getElementById('accEmail').textContent=u.email;
    document.getElementById('ordCount').textContent=S.cartCount();
    document.getElementById('wishCount2').textContent=S.wishCount();
  }
</script>
</body>
</html>

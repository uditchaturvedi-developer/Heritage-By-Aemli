<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shop — Heritage By Aemli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="shop">
<a class="skip" href="#main">Skip to content</a>
<div id="siteHeader"></div>

<main id="main">
  <section class="shop-hero">
    <div class="container">
      <p class="kicker">The Collection</p>
      <h1>Shop All Styles</h1>
    </div>
  </section>

  <div class="container">
    <div class="shop-layout">
      <aside class="filters" id="filters">
        <h4>Color</h4><div id="fColor"></div>
        <h4>Fabric</h4><div id="fFabric"></div>
        <h4>Occasion</h4><div id="fOccasion"></div>
        <button class="clear" id="clearBtn">Clear all filters</button>
      </aside>

      <div>
        <div class="toolbar">
          <span class="count" id="count">—</span>
          <label style="font-size:14px;color:var(--muted)">Sort
            <select id="sort">
              <option value="featured">Featured</option>
              <option value="asc">Price: Low to High</option>
              <option value="desc">Price: High to Low</option>
              <option value="rating">Top Rated</option>
            </select>
          </label>
        </div>
        <div class="grid" id="grid"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
  const params=new URLSearchParams(location.search);
  const q=params.get('q')||'';
  function buildGroup(id,arr,precheck){
    document.getElementById(id).innerHTML=arr.map(v=>`<label><input type="checkbox" value="${v}" ${precheck.includes(v)?'checked':''}> ${v}</label>`).join('');
  }
  buildGroup('fColor',window.AEMLI_COLORS,(params.get('color')||'').split(',').filter(Boolean));
  buildGroup('fFabric',window.AEMLI_FABRICS,(params.get('fabric')||'').split(',').filter(Boolean));
  buildGroup('fOccasion',window.AEMLI_OCCASIONS,(params.get('occasion')||'').split(',').filter(Boolean));

  function checked(group){ return [...document.querySelectorAll(`#${group} input:checked`)].map(i=>i.value); }
  let page=1; const PER=8;

  function getFiltered(){
    const col=checked('fColor'), fab=checked('fFabric'), occ=checked('fOccasion');
    let list=window.AEMLI_PRODUCTS.filter(p=>{
      if(q && !(p.name.toLowerCase().includes(q)||p.collection.toLowerCase().includes(q)||p.color.toLowerCase().includes(q))) return false;
      if(col.length && !col.includes(p.color)) return false;
      if(fab.length && !fab.includes(p.fabric)) return false;
      if(occ.length && !p.occasion.some(o=>occ.includes(o))) return false;
      return true;
    });
    const sort=document.getElementById('sort').value;
    if(sort==='asc') list.sort((a,b)=>a.price-b.price);
    else if(sort==='desc') list.sort((a,b)=>b.price-a.price);
    else if(sort==='rating') list.sort((a,b)=>b.rating-a.rating);
    else list.sort((a,b)=>b.rating-a.rating);
    return list;
  }

  function render(){
    const list=getFiltered();
    document.getElementById('count').textContent=`${list.length} style${list.length!==1?'s':''} found${q?` for “${q}”`:''}`;
    const totalPages=Math.max(1,Math.ceil(list.length/PER));
    if(page>totalPages) page=totalPages;
    const slice=list.slice((page-1)*PER,page*PER);
    const grid=document.getElementById('grid');
    grid.innerHTML = slice.length ? slice.map(p=>AEMLI_UI.productCard(p)).join('') :
      `<div class="empty">No styles match these filters. <a href="shop.html" style="color:var(--rose);font-weight:600">Reset</a></div>`;
    const pag=document.getElementById('pagination');
    pag.innerHTML='';
    for(let i=1;i<=totalPages;i++){ const b=document.createElement('button'); b.textContent=i; if(i===page)b.classList.add('active'); b.onclick=()=>{page=i;render();window.scrollTo({top:document.querySelector('.shop-layout').offsetTop-90,behavior:'smooth'});}; pag.appendChild(b); }
  }

  document.getElementById('filters').addEventListener('change',()=>{page=1;render();});
  document.getElementById('sort').addEventListener('change',render);
  document.getElementById('clearBtn').addEventListener('click',()=>{location.href='shop.html';});

  if(q) document.getElementById('q').value=q;
  render();
</script>
</body>
</html>
